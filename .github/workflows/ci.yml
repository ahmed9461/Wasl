name: Android CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-ci-wasl-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle without persistent Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon :core:domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify generated Room schema v11
        run: |
          SCHEMA="app/schemas/com.wasl.app.data.local.WaslDatabase/11.json"
          test "$(jq -r '.database.version' "$SCHEMA")" = "11"
          jq -e '.database.entities[] | select(.tableName == "payment_claims")' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "attachments")' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "attachments") | .indices[] | select(.name == "index_attachments_relative_path" and .unique == true)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expenses")' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expenses") | .indices[] | select(.name == "index_group_expenses_command_id" and .unique == true)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expense_shares")' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expense_shares") | .indices[] | select(.name == "index_group_expense_shares_group_expense_id_sequence_number" and .unique == true)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expense_shares") | .indices[] | select(.name == "index_group_expense_shares_group_expense_id_person_id" and .unique == true)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "group_expense_shares") | .indices[] | select(.name == "index_group_expense_shares_debt_id" and .unique == true)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "document_templates")' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "document_templates") | .indices[] | select(.name == "index_document_templates_is_default" and .unique == false)' "$SCHEMA" >/dev/null
          jq -e '.database.entities[] | select(.tableName == "document_templates") | .indices[] | select(.name == "index_document_templates_style" and .unique == false)' "$SCHEMA" >/dev/null
          git diff --exit-code -- app/schemas/

      - name: Summarize unit test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          files = sorted(Path('.').glob('**/build/test-results/**/TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          message = f"JUnit XML reports: {len(files)}; " + ', '.join(f"{k}={v}" for k, v in totals.items())
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          if not files or totals['failures'] or totals['errors']:
              raise SystemExit('Unit test reports are missing or contain failures.')
          PYTEST

      - name: Upload latest main debug APK
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Delete obsolete Wasl CI artifacts
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.workflow_run.id,.name] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id run_id name; do
            [ -z "${id:-}" ] && continue
            case "$name" in
              Wasl-debug|Wasl-room-schema|Wasl-room-instrumentation-results|Wasl-account-document-evidence|Wasl-payment-receipt-evidence)
                if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                  echo "Deleting obsolete CI artifact: $name ($id)"
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
                fi
                ;;
            esac
          done < /tmp/artifacts.tsv
