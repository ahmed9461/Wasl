          account_card = r'''@Composable
internal fun AccountCard(
    account: AccountOverview,
    onClick: () -> Unit,
) {
    val header = account.ledger.header
    val receivable = header.direction == DebtDirection.RECEIVABLE
    val tagPrefix = "account-${header.id.value}"
    Card(
        onClick = onClick,
        modifier = Modifier.fillMaxWidth().testTag(tagPrefix),
        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceContainerLow),
    ) {
        Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            BoxWithConstraints(Modifier.fillMaxWidth()) {
                if (shouldStackDenseRows(maxWidth)) {
                    Column(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-header-stacked"),
                        verticalArrangement = Arrangement.spacedBy(7.dp),
                    ) {
                        AccountIdentityRow(account, receivable, Modifier.fillMaxWidth())
                        AccountDirectionBadge(receivable)
                    }
                } else {
                    Row(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-header-inline"),
                        horizontalArrangement = Arrangement.spacedBy(10.dp),
                        verticalAlignment = Alignment.CenterVertically,
                    ) {
                        AccountIdentityRow(account, receivable, Modifier.weight(1f))
                        AccountDirectionBadge(receivable)
                    }
                }
            }

            BoxWithConstraints(Modifier.fillMaxWidth()) {
                if (shouldStackDenseRows(maxWidth)) {
                    Column(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-balance-stacked"),
                        verticalArrangement = Arrangement.spacedBy(7.dp),
                    ) {
                        AccountRemainingBalance(account)
                        AccountStateBadge(account.ledger.state)
                    }
                } else {
                    Row(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-balance-inline"),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.Bottom,
                    ) {
                        AccountRemainingBalance(account)
                        AccountStateBadge(account.ledger.state)
                    }
                }
            }

            BoxWithConstraints(Modifier.fillMaxWidth()) {
                val dueText = header.dueDate?.let { "الاستحقاق ${it.format(dueDateFormatter)}" }
                    ?: "بدون تاريخ استحقاق"
                if (shouldStackDenseRows(maxWidth)) {
                    Column(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-original-stacked"),
                        verticalArrangement = Arrangement.spacedBy(2.dp),
                    ) {
                        Text(dueText, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                        Text("الأصل ${formatMoney(header.originalAmount)}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                    }
                } else {
                    Row(
                        Modifier.fillMaxWidth().testTag("$tagPrefix-original-inline"),
                        horizontalArrangement = Arrangement.SpaceBetween,
                    ) {
                        Text(dueText, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
