name: Patch person contact details

on:
  push:
    branches:
      - agent/person-contact-details
    paths:
      - .github/scripts/patch_person_contact_details.py
      - .github/workflows/patch-person-contact-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/person-contact-details
          fetch-depth: 0
      - name: Apply checked patch
        run: python .github/scripts/patch_person_contact_details.py
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q 'personPhone: String? = null' app/src/main/java/com/wasl/app/data/RepositoryModels.kt
          grep -q 'create-person-phone' app/src/main/java/com/wasl/app/WaslApp.kt
          grep -q 'normalizedPhone' app/src/main/java/com/wasl/app/data/local/RoomWaslRepository.kt
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wasl/app/data/RepositoryModels.kt \
                  app/src/main/java/com/wasl/app/HomeViewModel.kt \
                  app/src/main/java/com/wasl/app/data/local/RoomWaslRepository.kt \
                  app/src/main/java/com/wasl/app/WaslApp.kt
          git commit -m 'feat: capture person contact details during account creation'
          git push origin HEAD:agent/person-contact-details
