name: Apply smart reminder UI copy

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write

jobs:
  apply-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update reminder copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/java/com/wasl/app/AccountDetailsScreen.kt"),
              Path("app/src/main/java/com/wasl/app/WaslApp.kt"),
          ]
          shared = {
              'ذكرني يوم الاستحقاق': 'متابعة ذكية للاستحقاق',
              'تذكير عادي قرابة 09:00 حسب توقيت الجهاز': 'قبل الموعد بيوم، يوم الموعد، بعد يومين، ثم أسبوعيًا حتى السداد.',
              'سيُحفظ التذكير، لكنه لن يظهر حتى تسمح بإشعارات وَصل.': 'ستُحفظ المتابعة، لكنها لن تظهر حتى تسمح بإشعارات وَصل.',
          }
          account_only = {
              'الموعد والتذكير': 'الموعد والمتابعة',
              'إضافة موعد وتذكير': 'إضافة موعد ومتابعة',
              'تعديل الموعد والتذكير': 'تعديل الموعد والمتابعة',
              'تم تعديل تذكير الاستحقاق': 'تم تعديل متابعة الاستحقاق',
              'تم تحديث موعد الاستحقاق وجدولة التذكير في حساب $personName.': 'تم تحديث موعد الاستحقاق وتفعيل المتابعة الذكية في حساب $personName.',
              'مفعل — ${formatInstant(it.triggerAt)}': 'متابعة ذكية — ${formatInstant(it.triggerAt)}',
          }

          changed = False
          for path in files:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in shared.items():
                  text = text.replace(old, new)
              if path.name == "AccountDetailsScreen.kt":
                  for old, new in account_only.items():
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed = True

          if not changed:
              raise SystemExit("No reminder copy changed; refusing an empty automation commit.")
          PY

      - name: Commit copy and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-smart-reminder-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wasl/app/AccountDetailsScreen.kt app/src/main/java/com/wasl/app/WaslApp.kt
          git commit -m "ui: describe smart reminder escalation"
          git push origin HEAD:${GITHUB_REF_NAME}
