name: Apply installment date picker import fix

on:
  push:
    branches:
      - agent/ui-redesign-v0.3-corrective
    paths:
      - '.github/workflows/fix-installment-date-picker.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-redesign-v0.3-corrective
          fetch-depth: 0
      - name: Add missing Material3 date picker state import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wasl/app/InstallmentsHubScreen.kt')
          s = p.read_text()
          needle = 'import androidx.compose.material3.DatePickerDialog\n'
          addition = needle + 'import androidx.compose.material3.rememberDatePickerState\n'
          if 'import androidx.compose.material3.rememberDatePickerState\n' not in s:
              if needle not in s:
                  raise SystemExit('DatePickerDialog import anchor not found')
              s = s.replace(needle, addition, 1)
              p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-installment-date-picker.yml
          git config user.name "wasl-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/wasl/app/InstallmentsHubScreen.kt
          git commit -m "fix(ui): restore installment date picker state import"
          git push origin HEAD:agent/ui-redesign-v0.3-corrective
