name: V04 Batch1 Apply

on:
  push:
    branches:
      - agent/ui-ux-hardening-v0.4
    paths:
      - tools/v04_batch1_trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-hardening-v0.4
          fetch-depth: 0

      - name: Apply v0.4 UX batch 1
        run: python3 tools/v04_apply_batch1.py

      - name: Commit product changes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/v04_apply_batch1.py tools/v04_batch1_trigger.txt .github/workflows/v04-batch1-apply.yml
          git add app/src/main/java/com/wasl/app/AdaptiveLayout.kt \
                  app/src/main/java/com/wasl/app/WaslApp.kt \
                  app/src/main/java/com/wasl/app/GroupExpenseDialogs.kt \
                  app/src/main/java/com/wasl/app/PaymentPromiseUi.kt \
                  app/src/main/java/com/wasl/app/MainActivity.kt \
                  app/src/main/java/com/wasl/app/DocumentsHubScreen.kt
          git commit -m "fix(v0.4): compact primary UX and harden attachments"
          git push origin HEAD:agent/ui-ux-hardening-v0.4
