name: Apply group expense UI logic

on:
  push:
    branches:
      - agent/group-expense-ui-logic
    paths:
      - .github/workflows/apply-group-expense-ui-logic.yml
      - .github/scripts/patch_group_expense_ui_logic.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-expense-ui-logic
          fetch-depth: 0
      - name: Apply deterministic patch
        run: |
          python .github/scripts/patch_group_expense_ui_logic.py
          git diff --check
          grep -q "fun reviewGroupExpense" app/src/main/java/com/wasl/app/HomeViewModel.kt
          grep -q "fun confirmGroupExpense" app/src/main/java/com/wasl/app/HomeViewModel.kt
      - name: Commit patch and cleanup
        run: |
          rm .github/scripts/patch_group_expense_ui_logic.py
          rm .github/workflows/apply-group-expense-ui-logic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add group expense review state'
          git push origin HEAD:agent/group-expense-ui-logic
