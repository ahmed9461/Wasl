name: Fix strong alarm preview

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fix preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/wasl/app/WaslApp.kt')
          text = path.read_text(encoding='utf-8')
          reminder = '                onReminderChange = {},'
          permission = '                notificationPermissionGranted = true,'
          if reminder not in text or permission not in text:
              raise SystemExit('Preview anchors not found')
          text = text.replace(
              reminder,
              reminder + '\n                onStrongAlarmChange = {},',
              1,
          )
          text = text.replace(
              permission,
              permission + '\n                exactAlarmAccessGranted = true,',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-strong-preview.yml
          git add app/src/main/java/com/wasl/app/WaslApp.kt
          git commit -m "fix: wire strong alarm preview"
          git push origin HEAD:${GITHUB_REF_NAME}
