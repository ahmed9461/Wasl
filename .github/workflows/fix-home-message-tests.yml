name: Fix Home reminder message tests

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sync message expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/wasl/app/HomeViewModelTest.kt')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'تم حفظ الحساب وجدولة التذكير.': 'تم حفظ الحساب وتفعيل المتابعة الذكية.',
              'تم حفظ الحساب والتذكير، وستُعاد محاولة الجدولة تلقائيًا.': 'تم حفظ الحساب والمتابعة، وستُعاد محاولة الجدولة تلقائيًا.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected message not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit synced tests and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-message-tests.yml
          git add app/src/test/java/com/wasl/app/HomeViewModelTest.kt
          git commit -m "test: sync Home reminder success messages"
          git push origin HEAD:${GITHUB_REF_NAME}
