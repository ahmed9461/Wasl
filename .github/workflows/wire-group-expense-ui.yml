name: Wire group expense UI

on:
  push:
    branches:
      - agent/group-expense-ui-compose
    paths:
      - .github/workflows/wire-group-expense-ui.yml
      - .github/scripts/wire_group_expense_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-expense-ui-compose
          fetch-depth: 0
      - name: Apply deterministic UI wiring
        run: |
          python .github/scripts/wire_group_expense_ui.py
          git diff --check
          grep -q 'onOpenCreate = homeViewModel::openCreateTypePicker' app/src/main/java/com/wasl/app/WaslApp.kt
          grep -q 'GroupExpenseDialog(' app/src/main/java/com/wasl/app/WaslApp.kt
      - name: Commit UI wiring and cleanup
        run: |
          rm .github/scripts/wire_group_expense_ui.py
          rm .github/workflows/wire-group-expense-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire group expense creation flow'
          git push origin HEAD:agent/group-expense-ui-compose
