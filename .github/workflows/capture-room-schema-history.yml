name: Capture Room schema history

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/workflows/capture-room-schema-history.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact Room v8 and v9 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          schema_dir='app/schemas/com.wasl.app.data.local.WaslDatabase'
          mkdir -p "$schema_dir"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9651072818/zip" \
            --output /tmp/room-v8.zip
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9664998888/zip" \
            --output /tmp/room-v9.zip
          unzip -p /tmp/room-v8.zip 8.json > "$schema_dir/8.json"
          unzip -p /tmp/room-v9.zip 9.json > "$schema_dir/9.json"

      - name: Validate recovered schemas
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('app/schemas/com.wasl.app.data.local.WaslDatabase')
          expected = {
              8: ('916f9ad1c7d2bde14556f92d37c663bb', 'e0c3640234b2cb8b20db3a2df678e60fff030a9f5474664b3a974dcc706c8d0e'),
              9: ('fe9df0a3e53fdaa683f9e81d4ec7263f', '68c63d7eee7c0124b9bf7721034516304c4a4826589f42e00a92bdc340bb336c'),
          }
          for version, (identity_hash, sha256) in expected.items():
              path = root / f'{version}.json'
              raw = path.read_bytes()
              payload = json.loads(raw)
              assert payload['database']['version'] == version, (path, payload['database']['version'])
              assert payload['database']['identityHash'] == identity_hash, (path, payload['database']['identityHash'])
              assert hashlib.sha256(raw).hexdigest() == sha256, path
              print(f'{path}: version={version} identity={identity_hash} sha256={sha256}')
          PY

      - name: Commit schema history and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/capture-room-schema-history.yml
          git add app/schemas/com.wasl.app.data.local.WaslDatabase/8.json app/schemas/com.wasl.app.data.local.WaslDatabase/9.json
          git diff --cached --check
          git commit -m 'chore: preserve Room v8 and v9 schemas'
          git push origin "HEAD:${GITHUB_REF_NAME}"
