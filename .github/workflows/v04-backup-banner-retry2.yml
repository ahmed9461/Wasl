name: V0.4 banner backup retry2

on:
  push:
    branches:
      - agent/ui-ux-hardening-v0.4
    paths:
      - .github/workflows/v04-backup-banner-retry2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-hardening-v0.4
          fetch-depth: 0
      - name: Apply original hardening script with atomic regex replacement
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/v04-backup-banner-once.yml').read_text()
          block = raw.split('        run: |\n', 1)[1].split('      - name: Remove one-shot workflow\n', 1)[0]
          script = textwrap.dedent(block)
          bad = '''once('val SHA256_REGEX = Regex("^[0-9a-fA-F]{64}$")', 'val SHA256_REGEX = Regex("^[0-9a-fA-F]{64}$")\\n        val BANNER_FILE_REGEX = Regex("[0-9a-f]{64}\\\\\\\\.img")')'''
          good = '''old_sha_regex = '        val SHA256_REGEX = Regex("^[0-9a-fA-F]{64}$")'; pos = s.rfind(old_sha_regex); assert pos >= 0, 'Missing companion SHA regex'; new_sha_regex = old_sha_regex + '\\n        val BANNER_FILE_REGEX = Regex("[0-9a-f]{64}\\\\\\\\.img")'; s = s[:pos] + new_sha_regex + s[pos + len(old_sha_regex):]'''
          if bad not in script:
              raise SystemExit('Ambiguous SHA regex operation not found.')
          exec(compile(script.replace(bad, good, 1), '<v04-backup-hardening>', 'exec'), {})
      - name: Remove temporary workflows
        run: |
          rm .github/workflows/v04-backup-banner-once.yml
          rm .github/workflows/v04-backup-banner-retry.yml
          rm .github/workflows/v04-backup-banner-retry2.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wasl/app/backup/BackupService.kt app/src/androidTest/java/com/wasl/app/backup/BackupRestoreInstrumentedTest.kt .github/workflows/
          git commit -m "feat(backup): preserve document banner vault in schema v12 backups"
          git push origin HEAD:agent/ui-ux-hardening-v0.4
