name: Signed Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASL_KEYSTORE_PASSWORD: ${{ secrets.WASL_KEYSTORE_PASSWORD }}
      WASL_KEY_ALIAS: ${{ secrets.WASL_KEY_ALIAS }}
      WASL_KEY_PASSWORD: ${{ secrets.WASL_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          WASL_KEYSTORE_BASE64: ${{ secrets.WASL_KEYSTORE_BASE64 }}
        run: |
          test -n "$WASL_KEYSTORE_BASE64"
          test -n "$WASL_KEYSTORE_PASSWORD"
          test -n "$WASL_KEY_ALIAS"
          test -n "$WASL_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle without persistent Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Materialize release keystore
        env:
          WASL_KEYSTORE_BASE64: ${{ secrets.WASL_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/wasl-release.jks"
          printf '%s' "$WASL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "WASL_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload current signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-0.1.0-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Delete older signed release artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.workflow_run.id,.name] | @tsv' > /tmp/artifacts.tsv
          while IFS=$'\t' read -r id run_id name; do
            [ -z "${id:-}" ] && continue
            if [[ "$name" == Wasl-*-signed-apk && "$run_id" != "$GITHUB_RUN_ID" ]]; then
              echo "Deleting previous signed release artifact: $name ($id)"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done < /tmp/artifacts.tsv
