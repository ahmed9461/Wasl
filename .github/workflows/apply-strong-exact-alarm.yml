name: Apply strong exact alarm implementation

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply strong alarm feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_span(path, start, end, replacement):
              text = read(path)
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'Start marker not found in {path}: {start!r}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'End marker not found in {path}: {end!r}')
              write(path, text[:a] + replacement + text[b:])

