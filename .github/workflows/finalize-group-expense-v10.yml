name: Finalize group expense v10 foundation

on:
  push:
    branches:
      - agent/group-expense-v10-foundation
    paths:
      - .github/workflows/finalize-group-expense-v10.yml
      - .github/scripts/harden_group_backup_v10.py

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-expense-v10-foundation
          fetch-depth: 0

      - name: Download exact Room v10 schema artifact
        uses: actions/download-artifact@v4
        with:
          name: Wasl-room-schema
          path: .tmp-room-schema
          github-token: ${{ github.token }}
          repository: ahmed9461/Wasl
          run-id: 33131726199

      - name: Apply checked backup hardening and exact schema
        run: |
          test "$(sha256sum .tmp-room-schema/10.json | awk '{print $1}')" = "1c5a9c10a6f119225b1c0e6a822ba4c8d222576d939895b8531b92889ecee41c"
          mkdir -p app/schemas/com.wasl.app.data.local.WaslDatabase
          cp .tmp-room-schema/10.json app/schemas/com.wasl.app.data.local.WaslDatabase/10.json
          python .github/scripts/harden_group_backup_v10.py
          git diff --check
          grep -q "trim(command_id) = ''" app/src/main/java/com/wasl/app/backup/BackupService.kt
          grep -q "currency_code NOT GLOB '\[A-Z\]\[A-Z\]\[A-Z\]'" app/src/main/java/com/wasl/app/backup/BackupService.kt
          grep -q "sequence_number <= 0" app/src/main/java/com/wasl/app/backup/BackupService.kt
          test "$(jq -r '.database.version' app/schemas/com.wasl.app.data.local.WaslDatabase/10.json)" = "10"
          test "$(jq -r '.database.identityHash' app/schemas/com.wasl.app.data.local.WaslDatabase/10.json)" = "2093ac167061d7665ef689ff79de11a1"

      - name: Commit final v10 foundation and cleanup
        run: |
          rm -rf .tmp-room-schema
          rm .github/scripts/harden_group_backup_v10.py
          rm .github/workflows/finalize-group-expense-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden group backup restore and pin Room v10 schema'
          git push origin HEAD:agent/group-expense-v10-foundation
