name: Apply v0.4 banner core

on:
  push:
    branches:
      - agent/ui-ux-hardening-v0.4
    paths:
      - .github/workflows/v04-banner-core-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
