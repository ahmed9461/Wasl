name: Patch adaptive home

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/workflows/patch-home-adaptive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-wasl-foundation

      - name: Apply deterministic Home patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('app/src/main/java/com/wasl/app/WaslApp.kt')
          text = path.read_text()

          import_line = 'import androidx.compose.foundation.layout.Box\n'
          box_constraints_import = 'import androidx.compose.foundation.layout.BoxWithConstraints\n'
          if box_constraints_import not in text:
              if import_line not in text:
                  raise SystemExit('Box import marker missing')
              text = text.replace(import_line, import_line + box_constraints_import, 1)

          account_start = text.index('@Composable\nprivate fun AccountCard(')
          account_end = text.index('@Composable\nprivate fun MoneyRow(', account_start)
          account_block = dedent('''
          @Composable
          internal fun AccountCard(
              account: AccountOverview,
              onClick: () -> Unit,
          ) {
              val header = account.ledger.header
              val receivable = header.direction == DebtDirection.RECEIVABLE
              val tagPrefix = "account-${header.id.value}"
              Card(
                  onClick = onClick,
                  modifier = Modifier
                      .fillMaxWidth()
                      .testTag(tagPrefix),
                  colors = CardDefaults.cardColors(
                      containerColor = MaterialTheme.colorScheme.surfaceContainerLowest,
                  ),
                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp),
              ) {
                  Column(
                      modifier = Modifier.padding(18.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                  ) {
                      BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                          if (shouldStackDenseRows(maxWidth)) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-header-stacked"),
                                  verticalArrangement = Arrangement.spacedBy(10.dp),
                              ) {
                                  AccountIdentityRow(
                                      account = account,
                                      receivable = receivable,
                                      modifier = Modifier.fillMaxWidth(),
                                  )
                                  AccountDirectionBadge(receivable = receivable)
                              }
                          } else {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-header-inline"),
                                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                              ) {
                                  AccountIdentityRow(
                                      account = account,
                                      receivable = receivable,
                                      modifier = Modifier.weight(1f),
                                  )
                                  AccountDirectionBadge(receivable = receivable)
                              }
                          }
                      }

                      HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant)

                      BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                          if (shouldStackDenseRows(maxWidth)) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-balance-stacked"),
                                  verticalArrangement = Arrangement.spacedBy(10.dp),
                              ) {
                                  AccountRemainingBalance(account = account)
                                  AccountStateBadge(state = account.ledger.state)
                              }
                          } else {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-balance-inline"),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.Bottom,
                              ) {
                                  AccountRemainingBalance(account = account)
                                  AccountStateBadge(state = account.ledger.state)
                              }
                          }
                      }

                      BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                          if (shouldStackDenseRows(maxWidth)) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-original-stacked"),
                                  verticalArrangement = Arrangement.spacedBy(3.dp),
                              ) {
                                  AccountOriginalAmount(header.originalAmount)
                              }
                          } else {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .testTag("$tagPrefix-original-inline"),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                              ) {
                                  Text(
                                      text = "الأصل",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                                  Text(
                                      text = formatMoney(header.originalAmount),
                                      style = MaterialTheme.typography.bodyMedium,
                                      fontWeight = FontWeight.SemiBold,
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun AccountIdentityRow(
              account: AccountOverview,
              receivable: Boolean,
              modifier: Modifier,
          ) {
              Row(
                  modifier = modifier,
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Surface(
                      modifier = Modifier.size(46.dp),
                      shape = MaterialTheme.shapes.large,
                      color = if (receivable) {
                          MaterialTheme.colorScheme.primaryContainer
                      } else {
                          MaterialTheme.colorScheme.secondaryContainer
                      },
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Text(
                              text = account.person.displayName.trim().firstOrNull()?.toString() ?: "و",
                              style = MaterialTheme.typography.titleMedium,
                              fontWeight = FontWeight.ExtraBold,
                              color = if (receivable) {
                                  MaterialTheme.colorScheme.onPrimaryContainer
                              } else {
                                  MaterialTheme.colorScheme.onSecondaryContainer
                              },
                          )
                      }
                  }
                  Column(
                      modifier = Modifier.weight(1f),
                      verticalArrangement = Arrangement.spacedBy(3.dp),
                  ) {
                      Text(
                          text = account.person.displayName,
                          style = MaterialTheme.typography.titleMedium,
                          fontWeight = FontWeight.Bold,
                      )
                      account.ledger.header.description?.let {
                          Text(
                              text = it,
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 2,
                          )
                      }
                  }
              }
          }

          @Composable
          private fun AccountDirectionBadge(receivable: Boolean) {
              Surface(
                  shape = MaterialTheme.shapes.extraLarge,
                  color = if (receivable) {
                      MaterialTheme.colorScheme.primaryContainer
                  } else {
                      MaterialTheme.colorScheme.secondaryContainer
                  },
              ) {
                  Text(
                      text = if (receivable) "لي عنده" else "عليّ له",
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp),
                      style = MaterialTheme.typography.labelLarge,
                      color = if (receivable) {
                          MaterialTheme.colorScheme.onPrimaryContainer
                      } else {
                          MaterialTheme.colorScheme.onSecondaryContainer
                      },
                  )
              }
          }

          @Composable
          private fun AccountRemainingBalance(account: AccountOverview) {
              Column(verticalArrangement = Arrangement.spacedBy(3.dp)) {
                  Text(
                      text = "المتبقي",
                      style = MaterialTheme.typography.labelLarge,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  Text(
                      text = formatMoney(account.ledger.balance),
                      style = MaterialTheme.typography.titleLarge,
                      fontWeight = FontWeight.ExtraBold,
                      textAlign = TextAlign.Start,
                  )
              }
          }

          @Composable
          private fun AccountStateBadge(state: DebtState) {
              Surface(
                  shape = MaterialTheme.shapes.extraLarge,
                  color = when (state) {
                      DebtState.SETTLED -> MaterialTheme.colorScheme.primaryContainer
                      DebtState.PARTIALLY_PAID -> MaterialTheme.colorScheme.tertiaryContainer
                      DebtState.OPEN -> MaterialTheme.colorScheme.surfaceContainerHigh
                  },
              ) {
                  Text(
                      text = when (state) {
                          DebtState.OPEN -> "مفتوح"
                          DebtState.PARTIALLY_PAID -> "مسدد جزئيًا"
                          DebtState.SETTLED -> "مسدد"
                      },
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp),
                      style = MaterialTheme.typography.labelLarge,
                      fontWeight = FontWeight.SemiBold,
                  )
              }
          }

          @Composable
          private fun AccountOriginalAmount(money: Money) {
              Text(
                  text = "الأصل",
                  style = MaterialTheme.typography.bodyMedium,
                  color = MaterialTheme.colorScheme.onSurfaceVariant,
              )
              Text(
                  text = formatMoney(money),
                  style = MaterialTheme.typography.bodyMedium,
                  fontWeight = FontWeight.SemiBold,
              )
          }
          ''').strip()
          text = text[:account_start] + account_block + '\n\n' + text[account_end:]

          summary_start = text.index('@Composable\nprivate fun SummaryCard(')
          summary_end = text.index('@Composable\nprivate fun StatusCard(', summary_start)
          summary_block = dedent('''
          @Composable
          internal fun SummaryCard(
              title: String,
              subtitle: String,
              values: List<String>,
              receivable: Boolean,
          ) {
              val tagPrefix = if (receivable) "summary-receivable" else "summary-payable"
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = if (receivable) {
                          MaterialTheme.colorScheme.primaryContainer
                      } else {
                          MaterialTheme.colorScheme.secondaryContainer
                      },
                  ),
                  elevation = CardDefaults.cardElevation(defaultElevation = 1.dp),
              ) {
                  Column(
                      modifier = Modifier.padding(18.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                  ) {
                      Column(verticalArrangement = Arrangement.spacedBy(3.dp)) {
                          Text(
                              text = title,
                              style = MaterialTheme.typography.titleMedium,
                              fontWeight = FontWeight.ExtraBold,
                              color = if (receivable) {
                                  MaterialTheme.colorScheme.onPrimaryContainer
                              } else {
                                  MaterialTheme.colorScheme.onSecondaryContainer
                              },
                          )
                          Text(
                              text = subtitle,
                              style = MaterialTheme.typography.bodyMedium,
                              color = if (receivable) {
                                  MaterialTheme.colorScheme.onPrimaryContainer
                              } else {
                                  MaterialTheme.colorScheme.onSecondaryContainer
                              },
                          )
                      }
                      HorizontalDivider(
                          color = if (receivable) {
                              MaterialTheme.colorScheme.onPrimaryContainer.copy(alpha = 0.18f)
                          } else {
                              MaterialTheme.colorScheme.onSecondaryContainer.copy(alpha = 0.18f)
                          },
                      )
                      values.forEachIndexed { index, value ->
                          val currency = supportedCurrencies[index]
                          val contentColor = if (receivable) {
                              MaterialTheme.colorScheme.onPrimaryContainer
                          } else {
                              MaterialTheme.colorScheme.onSecondaryContainer
                          }
                          BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                              if (shouldStackDenseRows(maxWidth)) {
                                  Column(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .testTag("$tagPrefix-${currency.value}-stacked"),
                                      verticalArrangement = Arrangement.spacedBy(3.dp),
                                  ) {
                                      Text(
                                          text = currency.value,
                                          style = MaterialTheme.typography.labelLarge,
                                          color = contentColor,
                                      )
                                      Text(
                                          text = value,
                                          modifier = Modifier.fillMaxWidth(),
                                          textAlign = TextAlign.End,
                                          style = MaterialTheme.typography.bodyLarge,
                                          fontWeight = FontWeight.Bold,
                                          color = contentColor,
                                      )
                                  }
                              } else {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .testTag("$tagPrefix-${currency.value}-inline"),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically,
                                  ) {
                                      Text(
                                          text = currency.value,
                                          style = MaterialTheme.typography.labelLarge,
                                          color = contentColor,
                                      )
                                      Text(
                                          text = value,
                                          textAlign = TextAlign.End,
                                          style = MaterialTheme.typography.bodyLarge,
                                          fontWeight = FontWeight.Bold,
                                          color = contentColor,
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          ''').strip()
          text = text[:summary_start] + summary_block + '\n\n' + text[summary_end:]
          path.write_text(text)

          test = dedent('''
          package com.wasl.app

          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.test.assertIsDisplayed
          import androidx.compose.ui.test.junit4.createComposeRule
          import androidx.compose.ui.test.onNodeWithTag
          import androidx.compose.ui.test.performClick
          import androidx.compose.ui.unit.Density
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import com.wasl.app.data.AccountOverview
          import com.wasl.app.data.DebtLifecycleState
          import com.wasl.app.data.PersonRecord
          import com.wasl.app.ui.theme.WaslTheme
          import com.wasl.domain.CurrencyCode
          import com.wasl.domain.DebtDirection
          import com.wasl.domain.DebtHeader
          import com.wasl.domain.DebtId
          import com.wasl.domain.DebtLedger
          import com.wasl.domain.LedgerEntryId
          import com.wasl.domain.Money
          import com.wasl.domain.PersonId
          import java.time.Instant
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import org.junit.Rule
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class HomeAdaptiveUiInstrumentedTest {
              @get:Rule
              val composeRule = createComposeRule()

              @Test
              fun largeFontStacksAccountCardRowsAndRetainsClick() {
                  val account = partialAccount()
                  var clicks = 0

                  composeRule.setContent {
                      val density = LocalDensity.current
                      CompositionLocalProvider(
                          LocalDensity provides Density(density.density, fontScale = 2f),
                      ) {
                          WaslTheme {
                              AccountCard(
                                  account = account,
                                  onClick = { clicks += 1 },
                              )
                          }
                      }
                  }

                  composeRule.onNodeWithTag("account-debt-1-header-stacked", useUnmergedTree = true)
                      .assertIsDisplayed()
                  composeRule.onNodeWithTag("account-debt-1-balance-stacked", useUnmergedTree = true)
                      .assertIsDisplayed()
                  composeRule.onNodeWithTag("account-debt-1-original-stacked", useUnmergedTree = true)
                      .assertIsDisplayed()
                  composeRule.onNodeWithTag("account-debt-1").performClick()
                  composeRule.runOnIdle { assertEquals(1, clicks) }
              }

              @Test
              fun largeFontStacksEverySummaryCurrencyRow() {
                  composeRule.setContent {
                      val density = LocalDensity.current
                      CompositionLocalProvider(
                          LocalDensity provides Density(density.density, fontScale = 2f),
                      ) {
                          WaslTheme {
                              SummaryCard(
                                  title = "لي عند الناس",
                                  subtitle = "حقوقك المفتوحة",
                                  values = listOf(
                                      formatMoney(Money(100_000L, CurrencyCode.YER)),
                                      formatMoney(Money(25_000L, CurrencyCode.SAR)),
                                      formatMoney(Money(12_345L, CurrencyCode.USD)),
                                  ),
                                  receivable = true,
                              )
                          }
                      }
                  }

                  composeRule.onNodeWithTag("summary-receivable-YER-stacked").assertIsDisplayed()
                  composeRule.onNodeWithTag("summary-receivable-SAR-stacked").assertIsDisplayed()
                  composeRule.onNodeWithTag("summary-receivable-USD-stacked").assertIsDisplayed()
              }

              private fun partialAccount(): AccountOverview {
                  val openedAt = Instant.parse("2026-01-01T00:00:00Z")
                  val personId = PersonId("person-1")
                  val header = DebtHeader(
                      id = DebtId("debt-1"),
                      personId = personId,
                      direction = DebtDirection.RECEIVABLE,
                      originalAmount = Money(250_000L, CurrencyCode.SAR),
                      openedAt = openedAt,
                      description = "شراء أجهزة ومستلزمات مع وصف أطول لاختبار تكبير النص داخل البطاقة.",
                  )
                  val ledger = DebtLedger(header).recordPayment(
                      id = LedgerEntryId("payment-1"),
                      amount = Money(50_000L, CurrencyCode.SAR),
                      paidAt = openedAt.plusSeconds(60),
                  )
                  return AccountOverview(
                      person = PersonRecord(
                          id = personId,
                          displayName = "محمد عبدالله الطويل للاختبار",
                          createdAt = openedAt,
                          updatedAt = openedAt,
                      ),
                      ledger = ledger,
                      lifecycleState = DebtLifecycleState.ACTIVE,
                  )
              }
          }
          ''').strip() + '\n'
          Path('app/src/androidTest/java/com/wasl/app/HomeAdaptiveUiInstrumentedTest.kt').write_text(test)
          PY

          sed -i 's/[[:space:]]\+$//' \
            app/src/main/java/com/wasl/app/WaslApp.kt \
            app/src/androidTest/java/com/wasl/app/HomeAdaptiveUiInstrumentedTest.kt
          git diff --check
          grep -F 'account-debt-1-header-stacked' app/src/androidTest/java/com/wasl/app/HomeAdaptiveUiInstrumentedTest.kt
          grep -F 'summary-receivable-USD-stacked' app/src/androidTest/java/com/wasl/app/HomeAdaptiveUiInstrumentedTest.kt

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wasl/app/WaslApp.kt \
            app/src/androidTest/java/com/wasl/app/HomeAdaptiveUiInstrumentedTest.kt
          git rm .github/workflows/patch-home-adaptive.yml
          git commit -m 'feat: harden home large-font layout'
          git push origin HEAD:agent/bootstrap-wasl-foundation
