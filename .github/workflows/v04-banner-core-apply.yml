          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def regex_sub_once(path, pattern, repl):
              text = read(path)
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one match, got {count}: {pattern}")
              write(path, updated)

