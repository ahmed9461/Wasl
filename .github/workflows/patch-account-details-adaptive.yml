name: Patch adaptive account details

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/workflows/patch-account-details-adaptive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-wasl-foundation
          fetch-depth: 0

      - name: Apply deterministic Account Details patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source_path = Path("app/src/main/java/com/wasl/app/AccountDetailsScreen.kt")
          source = source_path.read_text(encoding="utf-8")

          def dec(value):
              return base64.b64decode(value).decode("utf-8")

          replacements = [
              (dec(""), dec("ICAgICAgICBpdGVtKCJ0aW1lbGluZS1oZWFkaW5nIikgewogICAgICAgICAgICBBY2NvdW50VGltZWxpbmVIZWFkaW5nKCkKICAgICAgICB9Cg=="), "timeline heading"),
              (dec("", "utf-8")
          ]
PY