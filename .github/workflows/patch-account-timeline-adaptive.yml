name: Patch account timeline adaptive

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/workflows/patch-account-timeline-adaptive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-wasl-foundation
          fetch-depth: 0

      - name: Apply checked patch
        run: |
          python .github/scripts/patch_account_details_timeline.py
          git diff --check
          grep -q 'PaymentTimelineStatusHeader' app/src/main/java/com/wasl/app/AccountDetailsScreen.kt
          grep -q 'ltrIsolate(receipt.documentNumber)' app/src/main/java/com/wasl/app/AccountDetailsScreen.kt

      - name: Commit patch and cleanup
        run: |
          rm .github/scripts/patch_account_details_timeline.py
          rm .github/workflows/patch-account-timeline-adaptive.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wasl/app/AccountDetailsScreen.kt app/src/main/java/com/wasl/app/AccountDetailsTimelineAdaptive.kt app/src/androidTest/java/com/wasl/app/AccountDetailsTimelineAdaptiveUiInstrumentedTest.kt .github/scripts/patch_account_details_timeline.py .github/workflows/patch-account-timeline-adaptive.yml
          git commit -m 'fix: harden account timeline adaptive RTL layout'
          git push origin HEAD:agent/bootstrap-wasl-foundation
