name: Fix strong alarm permission UX

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply patch
        run: python3 .github/scripts/fix_strong_alarm_permission_ux.py

      - name: Commit fix and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-strong-alarm-permission-ux.yml
          git rm .github/scripts/fix_strong_alarm_permission_ux.py
          git add app/src/main/java/com/wasl/app/WaslApp.kt \
                  app/src/main/java/com/wasl/app/AccountDetailsScreen.kt \
                  app/src/androidTest/java/com/wasl/app/DueDateUiInstrumentedTest.kt
          git commit -m "fix: make exact alarm permission explicit"
          git push origin HEAD:${GITHUB_REF_NAME}
