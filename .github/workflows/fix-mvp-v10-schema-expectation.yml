name: Fix MVP v10 schema expectation

on:
  push:
    branches:
      - agent/group-expense-v10-foundation
    paths:
      - .github/workflows/fix-mvp-v10-schema-expectation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-expense-v10-foundation
          fetch-depth: 0
      - name: Update only stale acceptance schema expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/androidTest/java/com/wasl/app/MvpAcceptanceInstrumentedTest.kt')
          text = path.read_text(encoding='utf-8')
          old = '        assertEquals(9, backup.schemaVersion)\n'
          new = '        assertEquals(10, backup.schemaVersion)\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale schema assertion')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q 'assertEquals(10, backup.schemaVersion)' app/src/androidTest/java/com/wasl/app/MvpAcceptanceInstrumentedTest.kt
      - name: Commit fix and cleanup
        run: |
          rm .github/workflows/fix-mvp-v10-schema-expectation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align MVP backup schema expectation with v10'
          git push origin HEAD:agent/group-expense-v10-foundation
