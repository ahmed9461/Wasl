name: Apply person navigation patch

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/person-nav-apply.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-wasl-foundation
      - name: Apply patch
        run: python3 .github/scripts/patch_person_nav.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wasl/app/MainActivity.kt app/src/main/java/com/wasl/app/AccountDetailsScreen.kt
          git diff --cached --check
          git commit -m "feat: open person timeline from account details"
          git push origin HEAD:agent/bootstrap-wasl-foundation
