name: Patch document template v11 foundation

on:
  push:
    branches:
      - agent/document-template-v11-foundation
    paths:
      - .github/scripts/patch_document_template_v11.py
      - .github/workflows/patch-document-template-v11.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked v11 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_document_template_v11.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\ndef replace_all_exact(path, old, new, expected):'
          helper = '''\ndef replace_first_of_two(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'{path}: expected two occurrences before first replacement, found {count}')
              write(path, text.replace(old, new, 1))
          '''
          if anchor not in text:
              raise SystemExit('patch helper anchor missing')
          text = text.replace(anchor, helper + anchor, 1)

          section = text.index('# Account-document snapshot codec')
          needle = "replace_once(p,\n'''                footerText = snapshot.identity.footerText,\\n            )''',"
          pos = text.index(needle, section)
          text = text[:pos] + text[pos:].replace('replace_once(p,', 'replace_first_of_two(p,', 1)

          section = text.index('# Account document store mirrors template snapshot behavior.')
          needle = "replace_once(p,\n'''            identity = identity,\\n        )\\n        val entity = IssuedDocumentEntity(''',"
          pos = text.index(needle, section)
          text = text[:pos] + text[pos:].replace('replace_once(p,', 'replace_first_of_two(p,', 1)

          text = text.replace(
              'val ALL_MIGRATIONS = arrayOf(',
              'val ALL_MIGRATIONS: Array<Migration> = arrayOf(',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/patch_document_template_v11.py
          git diff --check
          grep -q 'version = 11' app/src/main/java/com/wasl/app/data/local/WaslDatabase.kt
          grep -q 'MIGRATION_10_11' app/src/main/java/com/wasl/app/data/local/WaslDatabase.kt
          grep -q 'SCHEMA_VERSION = 11' app/src/main/java/com/wasl/app/backup/BackupService.kt
          grep -q 'DocumentTemplateSnapshot' app/src/main/java/com/wasl/app/data/RepositoryModels.kt
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/patch_document_template_v11.py
          git add app
          git checkout -- .github/workflows/patch-document-template-v11.yml
          git diff --cached --check
          git commit -m 'feat: add immutable document template v11 foundation'
          git push origin HEAD:agent/document-template-v11-foundation
