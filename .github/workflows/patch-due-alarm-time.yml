name: Patch due alarm time

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation
    paths:
      - .github/due-alarm-patch-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-wasl-foundation
      - name: Apply focused due-alarm-time patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_after_once(text, needle, addition, path):
              if needle not in text:
                  raise SystemExit(f"needle not found in {path}: {needle!r}")
              return text.replace(needle, needle + addition, 1)

          vm_path = Path("app/src/main/java/com/wasl/app/AccountDetailsViewModel.kt")
          vm = vm_path.read_text()
          vm = vm.replace(
              "import java.time.LocalDate\nimport java.time.ZoneId",
              "import java.time.LocalDate\nimport java.time.LocalTime\nimport java.time.ZoneId",
              1,
          )
          vm = insert_after_once(
              vm,
              "    val strongAlarmEnabled: Boolean = false,\n",
              "    val strongAlarmTime: LocalTime = ReminderTime.defaultDueTime,\n",
              vm_path,
          )

          lines = vm.splitlines()
          out = []
          in_open = False
          inserted_open_context = False
          skip_strong_expr = 0
          inserted_current_time = False
          in_strong_request = False
          inserted_request_time = False
          for line in lines:
              if line == "    fun openDueScheduleDialog() {":
                  in_open = True
              elif in_open and line.startswith("    fun "):
                  in_open = False

              if skip_strong_expr:
                  skip_strong_expr -= 1
                  continue

              if in_open and line.strip() == "pendingDueScheduleCommand = null" and not inserted_open_context:
                  out.append(line)
                  out.extend([
                      "        val zoneId = zoneIdProvider()",
                      "        val activeStrongAlarm = account.strongAlarm?.takeIf {",
                      "            it.status != ReminderStatus.CANCELLED",
                      "        }",
                  ])
                  inserted_open_context = True
                  continue

              if in_open and line.strip() == "strongAlarmEnabled = account.strongAlarm":
                  indent = line[: len(line) - len(line.lstrip())]
                  out.extend([
                      f"{indent}strongAlarmEnabled = activeStrongAlarm != null,",
                      f"{indent}strongAlarmTime = activeStrongAlarm",
                      f"{indent}    ?.triggerAt",
                      f"{indent}    ?.atZone(zoneId)",
                      f"{indent}    ?.toLocalTime()",
                      f"{indent}    ?.withSecond(0)",
                      f"{indent}    ?.withNano(0)",
                      f"{indent}    ?: ReminderTime.defaultDueTime,",
                  ])
                  skip_strong_expr = 3
                  continue

              out.append(line)

              if line.strip() == "val currentStrongAlarmEnabled = account.strongAlarm":
                  inserted_current_time = True
              elif inserted_current_time and line.strip() == "?: false":
                  out.extend([
                      "        val currentStrongAlarmTime = account.strongAlarm",
                      "            ?.takeIf { it.status != ReminderStatus.CANCELLED }",
                      "            ?.triggerAt",
                      "            ?.atZone(zoneId)",
                      "            ?.toLocalTime()",
                      "            ?.withSecond(0)",
                      "            ?.withNano(0)",
                      "            ?: ReminderTime.defaultDueTime",
                  ])
                  inserted_current_time = False

              if line.strip() == "val strongAlarm = if (form.strongAlarmEnabled) {":
                  in_strong_request = True
              elif in_strong_request and line.strip() == "zoneId = zoneId," and not inserted_request_time:
                  out.append("                        time = form.strongAlarmTime,")
                  inserted_request_time = True
              elif in_strong_request and line.strip() == "zoneId = zoneId,":
                  pass

          vm = "\n".join(out) + "\n"
          vm = vm.replace(
              "            form.strongAlarmEnabled == currentStrongAlarmEnabled\n        ) {",
              "            form.strongAlarmEnabled == currentStrongAlarmEnabled &&\n            (!form.strongAlarmEnabled || form.strongAlarmTime == currentStrongAlarmTime)\n        ) {",
              1,
          )
          confirm_marker = "    fun confirmDueSchedule() {\n"
          if confirm_marker not in vm:
              raise SystemExit("confirmDueSchedule marker not found")
          update_time_fn = '''    fun updateDueScheduleStrongAlarmTime(value: LocalTime) {
              pendingDueScheduleCommand = null
              _uiState.update {
                  it.copy(
                      dueScheduleForm = it.dueScheduleForm.copy(
                          strongAlarmTime = value.withSecond(0).withNano(0),
                      ),
                      dueScheduleError = null,
                  )
              }
          }

          '''
          # YAML removes the common indentation from this heredoc; normalize Kotlin indentation explicitly.
          update_time_fn = "\n".join(
              line[4:] if line.startswith("    ") else line
              for line in update_time_fn.splitlines()
          ) + "\n"
          update_time_fn = "\n".join("    " + line if line else "" for line in update_time_fn.splitlines()) + "\n"
          vm = vm.replace(confirm_marker, update_time_fn + confirm_marker, 1)
          vm_path.write_text(vm)

          screen_path = Path("app/src/main/java/com/wasl/app/AccountDetailsScreen.kt")
          screen = screen_path.read_text()
          screen = screen.replace(
              "import androidx.compose.material3.TextButton\nimport androidx.compose.material3.TopAppBar",
              "import androidx.compose.material3.TextButton\nimport androidx.compose.material3.TimePicker\nimport androidx.compose.material3.TopAppBar\nimport androidx.compose.material3.rememberTimePickerState",
              1,
          )
          screen = screen.replace(
              "import java.time.LocalDate\nimport java.time.ZoneId",
              "import java.time.LocalDate\nimport java.time.LocalTime\nimport java.time.ZoneId",
              1,
          )
          screen = screen.replace(
              "    onDueScheduleStrongAlarmChange: (Boolean) -> Unit,\n",
              "    onDueScheduleStrongAlarmChange: (Boolean) -> Unit,\n    onDueScheduleStrongAlarmTimeChange: (LocalTime) -> Unit,\n",
              1,
          )
          screen = screen.replace(
              "            onStrongAlarmChange = onDueScheduleStrongAlarmChange,\n",
              "            onStrongAlarmChange = onDueScheduleStrongAlarmChange,\n            onStrongAlarmTimeChange = onDueScheduleStrongAlarmTimeChange,\n",
              1,
          )
          # Private dialog signature is the next onStrongAlarmChange declaration.
          screen = screen.replace(
              "    onStrongAlarmChange: (Boolean) -> Unit,\n    onRequestExactAlarmAccess: () -> Unit,",
              "    onStrongAlarmChange: (Boolean) -> Unit,\n    onStrongAlarmTimeChange: (LocalTime) -> Unit,\n    onRequestExactAlarmAccess: () -> Unit,",
              1,
          )
          screen = screen.replace(
              "    var showDatePicker by remember { androidx.compose.runtime.mutableStateOf(false) }\n    AlertDialog(",
              "    var showDatePicker by remember { androidx.compose.runtime.mutableStateOf(false) }\n    var showStrongAlarmTimePicker by remember { androidx.compose.runtime.mutableStateOf(false) }\n    AlertDialog(",
              1,
          )
          screen = screen.replace(
              '"منبه دقيق قرابة 09:00 يوم الاستحقاق. المتابعة الذكية تبقى كبديل آمن."',
              '"منبه دقيق في الوقت الذي تختاره يوم الاستحقاق. المتابعة الذكية تبقى كبديل آمن."',
              1,
          )
          permission_marker = "                if (form.strongAlarmEnabled && !exactAlarmAccessGranted) {\n"
          if permission_marker not in screen:
              raise SystemExit("strong alarm permission marker not found")
          time_button = '''                if (form.strongAlarmEnabled) {
                      OutlinedButton(
                          onClick = { showStrongAlarmTimePicker = true },
                          enabled = !isSaving,
                          modifier = Modifier
                              .fillMaxWidth()
                              .testTag("edit-strong-alarm-time"),
                      ) {
                          Text("وقت المنبه: ${formatLocalTime(form.strongAlarmTime)}")
                      }
                  }
          '''
          time_button = "\n".join(line[4:] if line.startswith("    ") else line for line in time_button.splitlines()) + "\n"
          screen = screen.replace(permission_marker, time_button + permission_marker, 1)
          date_picker_marker = "    if (showDatePicker) {\n"
          if date_picker_marker not in screen:
              raise SystemExit("date picker marker not found")
          picker = '''    if (showStrongAlarmTimePicker) {
              val timePickerState = rememberTimePickerState(
                  initialHour = form.strongAlarmTime.hour,
                  initialMinute = form.strongAlarmTime.minute,
                  is24Hour = true,
              )
              AlertDialog(
                  onDismissRequest = { showStrongAlarmTimePicker = false },
                  title = { Text("وقت المنبه القوي") },
                  text = { TimePicker(state = timePickerState) },
                  confirmButton = {
                      TextButton(
                          onClick = {
                              onStrongAlarmTimeChange(
                                  LocalTime.of(timePickerState.hour, timePickerState.minute),
                              )
                              showStrongAlarmTimePicker = false
                          },
                          modifier = Modifier.testTag("confirm-strong-alarm-time"),
                      ) { Text("اختيار") }
                  },
                  dismissButton = {
                      TextButton(onClick = { showStrongAlarmTimePicker = false }) { Text("إلغاء") }
                  },
              )
          }

          '''
          picker = "\n".join(line[4:] if line.startswith("    ") else line for line in picker.splitlines()) + "\n"
          screen = screen.replace(date_picker_marker, picker + date_picker_marker, 1)
          helper_marker = "private fun formatDate(date: LocalDate): String ="
          if helper_marker not in screen:
              raise SystemExit("formatDate helper not found")
          screen = screen.replace(
              helper_marker,
              'private fun formatLocalTime(time: LocalTime): String =\n    "%02d:%02d".format(Locale.US, time.hour, time.minute)\n\n' + helper_marker,
              1,
          )
          screen_path.write_text(screen)

          app_path = Path("app/src/main/java/com/wasl/app/WaslApp.kt")
          app = app_path.read_text()
          app = app.replace(
              "                                    onDueScheduleStrongAlarmChange = detailsViewModel::updateDueScheduleStrongAlarm,\n",
              "                                    onDueScheduleStrongAlarmChange = detailsViewModel::updateDueScheduleStrongAlarm,\n                                    onDueScheduleStrongAlarmTimeChange = detailsViewModel::updateDueScheduleStrongAlarmTime,\n",
              1,
          )
          app_path.write_text(app)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wasl/app/AccountDetailsViewModel.kt app/src/main/java/com/wasl/app/AccountDetailsScreen.kt app/src/main/java/com/wasl/app/WaslApp.kt
          git diff --cached --check
          git commit -m "fix: preserve configurable strong alarm time when editing due schedule"
          git push origin HEAD:agent/bootstrap-wasl-foundation
