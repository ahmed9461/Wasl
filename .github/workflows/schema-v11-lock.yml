name: Room Schema v11 Lock

on:
  push:
    branches:
      - agent/document-template-v11-hardening

permissions:
  contents: write

concurrency:
  group: room-schema-v11-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-schema:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate Room schema v11
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify generated schema
        run: |
          SCHEMA="app/schemas/com.wasl.app.data.local.WaslDatabase/11.json"
          test -f "$SCHEMA"
          test "$(jq -r '.database.version' "$SCHEMA")" = "11"
          jq -e '.database.entities[] | select(.tableName == "document_templates")' "$SCHEMA" >/dev/null

      - name: Commit generated schema
        run: |
          SCHEMA="app/schemas/com.wasl.app.data.local.WaslDatabase/11.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SCHEMA"
          if git diff --cached --quiet; then
            echo "Room schema v11 is already committed and current."
            exit 0
          fi
          git commit -m "chore: lock generated Room schema v11"
          git push origin HEAD:agent/document-template-v11-hardening
