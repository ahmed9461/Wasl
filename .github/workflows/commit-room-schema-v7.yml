name: Commit Room Schema v7

on:
  push:
    branches:
      - agent/bootstrap-wasl-foundation

permissions:
  contents: write
  actions: read

jobs:
  commit-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated schema artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 32869322053 \
            --repo "$GITHUB_REPOSITORY" \
            --name Wasl-room-schema \
            --dir "$RUNNER_TEMP/room-schema"

      - name: Verify generated schema
        run: |
          test "$(jq -r '.database.version' "$RUNNER_TEMP/room-schema/7.json")" = "7"
          test "$(jq -r '.database.identityHash' "$RUNNER_TEMP/room-schema/7.json")" = "d2c9fe45f2707138bc1476639617e255"

      - name: Commit exact Room schema artifact
        run: |
          mkdir -p app/schemas/com.wasl.app.data.local.WaslDatabase
          cp "$RUNNER_TEMP/room-schema/7.json" \
            app/schemas/com.wasl.app.data.local.WaslDatabase/7.json
          git add app/schemas/com.wasl.app.data.local.WaslDatabase/7.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit generated Room schema v7"
          git push origin "HEAD:${GITHUB_REF_NAME}"
