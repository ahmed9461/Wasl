name: Android CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-ci-wasl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon :core:domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Commit generated Room schema v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/bootstrap-wasl-foundation'
        env:
          SCHEMA: app/schemas/com.wasl.app.data.local.WaslDatabase/6.json
        run: |
          if [ -z "$(git status --porcelain -- "$SCHEMA")" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SCHEMA"
          git commit -m "db: sync Room schema v6"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload exported Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-room-schema
          path: app/schemas/com.wasl.app.data.local.WaslDatabase/6.json
          if-no-files-found: error

      - name: Verify committed Room schema is current
        run: |
          git show HEAD:app/schemas/com.wasl.app.data.local.WaslDatabase/6.json \
            | jq -S . > "$RUNNER_TEMP/room-schema-committed.json"
          jq -S . app/schemas/com.wasl.app.data.local.WaslDatabase/6.json \
            > "$RUNNER_TEMP/room-schema-generated.json"
          diff -u "$RUNNER_TEMP/room-schema-committed.json" \
            "$RUNNER_TEMP/room-schema-generated.json"

  database-tests:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Allow the emulator to use KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run Room integration tests on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true :app:connectedDebugAndroidTest
            mkdir -p app/build/outputs/payment-receipt
            adb exec-out run-as com.wasl.app cat files/test-artifacts/wasl-payment-receipt-sample.pdf > app/build/outputs/payment-receipt/wasl-payment-receipt-sample.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Inspect Arabic payment receipt artifact
        run: |
          PDF="app/build/outputs/payment-receipt/wasl-payment-receipt-sample.pdf"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ { print $2 }')"
          test "$PAGES" -ge 2
          pdftotext -layout "$PDF" app/build/outputs/payment-receipt/receipt-text.txt
          grep -F "PAY-2026-00042" app/build/outputs/payment-receipt/receipt-text.txt
          grep -F "AL NOOR TRADING" app/build/outputs/payment-receipt/receipt-text.txt
          grep -F "123,456.78 USD" app/build/outputs/payment-receipt/receipt-text.txt
          pdftoppm -png -r 144 "$PDF" \
            app/build/outputs/payment-receipt/receipt-page

      - name: Upload payment receipt PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-payment-receipt-evidence
          path: app/build/outputs/payment-receipt/
          if-no-files-found: warn

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-room-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
