          models = 'app/src/main/java/com/wasl/app/data/RepositoryModels.kt'
          for cls in ('PrepareDebtReceiptCommand', 'PreparePaymentReceiptCommand', 'PrepareAccountStatementCommand'):
              pattern = rf'(data class {cls}\(.*?    val footerText: String\? = null,\n)(    val issuedAt: Instant,)'
              regex_sub_once(models, pattern, r'\1    val issuerBanner: DocumentBannerAsset? = null,\n\2')

          # DAO must persist banner metadata on updates, not only on inserts.
          dao = 'app/src/main/java/com/wasl/app/data/local/dao/DocumentIdentityDao.kt'
          replace_once(
              dao,
              '            footer_text = :footerText,\n            is_default = 1,',
              '            footer_text = :footerText,\n            banner_relative_path = :bannerRelativePath,\n            banner_sha256 = :bannerSha256,\n            is_default = 1,',
          )
          replace_once(
              dao,
              '        footerText: String?,\n        updatedAt: Long,',
              '        footerText: String?,\n        bannerRelativePath: String?,\n        bannerSha256: String?,\n        updatedAt: Long,',
          )

          # Payment receipt repository: freeze + persist + replay-check banner.
          repo = 'app/src/main/java/com/wasl/app/data/local/RoomWaslRepository.kt'
          replace_once(
              repo,
              '            footerText = command.footerText.normalizedOptional(),\n        )\n        saveDefaultIdentity(command, normalizedIdentity)',
              '            footerText = command.footerText.normalizedOptional(),\n            banner = command.issuerBanner,\n        )\n        saveDefaultIdentity(command, normalizedIdentity)',
          )
          replace_once(
              repo,
              '                    footerText = snapshot.footerText,\n                    isDefault = true,',
              '                    footerText = snapshot.footerText,\n                    bannerRelativePath = snapshot.banner?.relativePath,\n                    bannerSha256 = snapshot.banner?.sha256,\n                    isDefault = true,',
          )
          replace_once(
              repo,
              '                    footerText = snapshot.footerText,\n                    updatedAt = command.issuedAt.toEpochMilli(),',
              '                    footerText = snapshot.footerText,\n                    bannerRelativePath = snapshot.banner?.relativePath,\n                    bannerSha256 = snapshot.banner?.sha256,\n                    updatedAt = command.issuedAt.toEpochMilli(),',
          )
          replace_once(
              repo,
              '                footerText = command.footerText.normalizedOptional(),\n            )\n        if (!matches)',
              '                footerText = command.footerText.normalizedOptional(),\n                banner = command.issuerBanner,\n            )\n        if (!matches)',
          )

          # Account document store follows the same identity snapshot contract.
          account_store = 'app/src/main/java/com/wasl/app/data/local/RoomAccountDocumentStore.kt'
